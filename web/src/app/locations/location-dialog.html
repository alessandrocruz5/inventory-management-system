<h2 mat-dialog-title>{{ data.location ? 'Edit location' : 'New location' }}</h2>
<form [formGroup]="form" (ngSubmit)="save()">
  <mat-dialog-content>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" maxlength="32" />
      @if (form.controls.code.errors?.['server']; as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Name</mat-label>
      <input matInput formControlName="name" maxlength="200" />
      @if (form.controls.name.errors?.['server']; as message) {
        <mat-error>{{ message }}</mat-error>
      }
    </mat-form-field>
    @if (error(); as message) {
      <p class="form-error" role="alert">{{ message }}</p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button type="submit" [disabled]="form.invalid || saving()">Save</button>
  </mat-dialog-actions>
</form>
