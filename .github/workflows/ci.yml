name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet build -warnaserror
      - run: dotnet format --verify-no-changes
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check banned packages
        run: bash .github/scripts/check-banned-packages.sh
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet test
      - name: Eval harness calibration (T20)
        run: dotnet run --project tests/Assistant.Evals -- --check
      - run: npm ci
        working-directory: web
      - run: npm test -- --watch=false
        working-directory: web
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/e2e/package-lock.json
      - name: Generate seed password
        run: |
          pw="E2e!$(openssl rand -hex 16)Aa9"
          echo "::add-mask::$pw"
          echo "E2E_PASSWORD=$pw" >> "$GITHUB_ENV"
      - name: Persist seed password for the AppHost
        run: dotnet user-secrets set "Parameters:seed-password" "$E2E_PASSWORD" --project src/AppHost > /dev/null
      - run: dotnet dev-certs https
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - run: npx playwright test
        working-directory: tests/e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
